name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Build containers are pinned by digest (each a multi-arch index, so the
# same pin serves both architectures). Renovate refreshes the digests but
# leaves each on the release it tracks; move to a new release by hand.

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libpipewire-0.3-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Only this job caches: it publishes nothing, so a poisoned cache
      # can't reach a release artifact.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  msrv:
    name: build with the minimum supported Rust
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libpipewire-0.3-dev libxkbcommon-dev
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo check --locked --all-targets

  audit:
    name: RustSec advisories
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit@0.22.2
      # Fails on vulnerabilities; unmaintained/unsound notices are
      # reported but don't fail the build.
      - run: cargo audit

  scripts:
    name: shellcheck + eslint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck gnome-extension/install.sh systemd/make-unit.sh tests/integration/*.sh
      - run: npx --yes eslint@10.12.0 gnome-extension kwin

  # Portable binaries. Built on Debian 12, the oldest base the pipewire
  # crate compiles against (PipeWire 0.3.65); the result needs only
  # glibc 2.34+, libpipewire-0.3.so.0 and libxkbcommon.so.0 at runtime,
  # so it runs on Ubuntu 22.04+, Debian 12+, Fedora 35+, RHEL 9+, and
  # the like.
  binary:
    name: binary (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container: debian:12@sha256:854dd8ab51d62866dbd8f5431d15ce77b12983a2a4a1e1fe43a2395dc7ef9f61
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config clang libpipewire-0.3-dev libxkbcommon-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - name: Check the glibc baseline
        run: |
          max=$(objdump -T target/release/waytool \
            | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -1)
          echo "highest glibc symbol version: $max"
          if [ "$(printf '%s\n' "$max" 2.34 | sort -V | tail -1)" != 2.34 ]; then
            echo "::error::binary needs glibc $max, newer than the 2.34 baseline"
            exit 1
          fi
      - name: Make the tarball
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          name=waytool-$version-${{ matrix.arch }}-linux
          mkdir -p dist "$name"
          cp target/release/waytool LICENSE README.md "$name/"
          tar -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.arch }}
          path: dist/*

  # End to end on a real compositor: the Wayland-protocol backend on
  # headless sway, typing into foot, capturing both outputs and moving
  # the pointer on a scaled one (tests/integration/sway.sh).
  sway:
    name: end-to-end on headless sway
    needs: binary
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    container:
      image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
      # sway carries a file capability, which needs SYS_NICE to exec.
      options: --cap-add SYS_NICE
    steps:
      - name: Install sway and the test clients
        run: dnf install -y --setopt=install_weak_deps=False sway foot wev dbus-daemon pipewire-libs libxkbcommon xkeyboard-config gawk tar gzip findutils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-x86_64
          path: dist
      - name: Install the binary
        run: tar -xzf dist/*.tar.gz --strip-components=1 -C /usr/local/bin --wildcards '*/waytool'
      - run: tests/integration/sway.sh

  # The same on niri, nested in headless sway (tests/integration/niri.sh).
  niri:
    name: end-to-end on niri
    needs: binary
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    container:
      image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
      options: --cap-add SYS_NICE
    steps:
      - name: Install sway, niri and the test clients
        run: dnf install -y --setopt=install_weak_deps=False sway niri foot dbus-daemon pipewire-libs libxkbcommon xkeyboard-config mesa-dri-drivers mesa-libEGL gawk tar gzip findutils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-x86_64
          path: dist
      - name: Install the binary
        run: tar -xzf dist/*.tar.gz --strip-components=1 -C /usr/local/bin --wildcards '*/waytool'
      - run: tests/integration/niri.sh

  # The same on labwc, nested in headless sway, with windows through
  # wlr-foreign-toplevel-management (tests/integration/labwc.sh).
  labwc:
    name: end-to-end on labwc
    needs: binary
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    container:
      image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
      options: --cap-add SYS_NICE
    steps:
      - name: Install sway, labwc and the test clients
        run: dnf install -y --setopt=install_weak_deps=False sway labwc foot wev dbus-daemon pipewire-libs libxkbcommon xkeyboard-config gawk tar gzip findutils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-x86_64
          path: dist
      - name: Install the binary
        run: tar -xzf dist/*.tar.gz --strip-components=1 -C /usr/local/bin --wildcards '*/waytool'
      - run: tests/integration/labwc.sh

  deb:
    name: deb (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config clang libpipewire-0.3-dev libxkbcommon-dev dpkg-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deb@3.8.0
      - run: cargo build --release --locked
      - name: Build the package
        run: |
          systemd/make-unit.sh /usr/bin/waytool > target/release/waytool.service
          cargo deb --no-build
      - name: Install and run it
        run: |
          apt-get install -y ./target/debian/*.deb
          waytool --help >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: target/debian/*.deb

  rpm:
    name: rpm (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
      - name: Install build dependencies
        run: dnf install -y git gcc clang pipewire-devel libxkbcommon-devel rpm-build tar gzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-generate-rpm@0.21.0
      - run: cargo build --release --locked
      - name: Build the package
        run: |
          systemd/make-unit.sh /usr/bin/waytool > target/release/waytool.service
          cargo generate-rpm -s "release = \"1$(rpm -E %dist)\""
      - name: Install and run it
        run: |
          dnf install -y ./target/generate-rpm/*.rpm
          waytool --help >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-${{ matrix.arch }}
          path: target/generate-rpm/*.rpm

  # On a v* tag, collect everything into a draft release to review and
  # publish by hand.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, binary, deb, rpm]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # Signed build provenance for each artifact, checkable with
      # `gh attestation verify FILE --repo mx-shift/waytool`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          (cd dist && sha256sum -- * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes dist/*
