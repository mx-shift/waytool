[package]
name = "waytool"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Command-line automation for Wayland: keyboard and pointer input, screenshots and window control on GNOME, KDE, wlroots compositors, Hyprland and niri"
license = "Apache-2.0"
repository = "https://github.com/mx-shift/waytool"
readme = "README.md"

[dependencies]
anyhow = "1.0.102"
ashpd = { version = "0.13.10", features = ["tokio", "remote_desktop", "screencast"] }
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
enumflags2 = "0.7.12"
futures-util = "0.3"
image = "0.25.10"
libc = "0.2.186"
pipewire = "0.10.0"
reis = { version = "0.7.1", features = ["tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["full"] }
# A git dependency on purpose: cosmic-protocols was relicensed from
# GPL-3.0-only to MIT after its last crates.io release (0.2.0, still
# GPL). This crate can't be published to crates.io while it depends on
# git, so it stays blocked until an MIT release exists to switch to.
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols", rev = "c0cff4db14c37ed954983158e4055aa94c7741d9", default-features = false, features = ["client"] }
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable", "staging"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
xkbcommon = { version = "0.9.0", default-features = false }
zbus = { version = "6.0.0", default-features = false, features = ["tokio", "p2p", "proxy", "service"] }

[profile.release]
strip = true

# Packaging. Both tools read target/release/waytool.service, which
# is generated before packaging:
#   systemd/make-unit.sh /usr/bin/waytool > target/release/waytool.service

[package.metadata.deb]
maintainer = "Rick Altherr <rick@mxshift.com>"
copyright = "Rick Altherr"
license-file = ["LICENSE", "0"]
section = "utils"
depends = "$auto"
suggests = "gnome-shell"
extended-description = """\
Synthetic keyboard and pointer input, per-monitor screenshots and window \
control on a Wayland desktop, through the freedesktop RemoteDesktop and \
ScreenCast portals or Wayland's virtual input and capture protocols. \
Includes a systemd user unit for the daemon, a KWin script for windows \
on KDE Plasma, and an optional gnome-shell extension for windows and \
text input on GNOME."""
assets = [
    ["target/release/waytool", "usr/bin/", "755"],
    ["target/release/waytool.service", "usr/lib/systemd/user/", "644"],
    ["gnome-extension/metadata.json", "usr/share/gnome-shell/extensions/waytool@mxshift.com/", "644"],
    ["gnome-extension/extension.js", "usr/share/gnome-shell/extensions/waytool@mxshift.com/", "644"],
    ["gnome-extension/service.js", "usr/share/gnome-shell/extensions/waytool@mxshift.com/", "644"],
    ["kwin/waytool.js", "usr/share/waytool/kwin/", "644"],
    ["autostart/waytool-tray.desktop", "etc/xdg/autostart/", "644"],
    ["README.md", "usr/share/doc/waytool/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/waytool", dest = "/usr/bin/waytool", mode = "755" },
    { source = "target/release/waytool.service", dest = "/usr/lib/systemd/user/waytool.service", mode = "644" },
    { source = "gnome-extension/metadata.json", dest = "/usr/share/gnome-shell/extensions/waytool@mxshift.com/metadata.json", mode = "644" },
    { source = "gnome-extension/extension.js", dest = "/usr/share/gnome-shell/extensions/waytool@mxshift.com/extension.js", mode = "644" },
    { source = "gnome-extension/service.js", dest = "/usr/share/gnome-shell/extensions/waytool@mxshift.com/service.js", mode = "644" },
    { source = "kwin/waytool.js", dest = "/usr/share/waytool/kwin/waytool.js", mode = "644" },
    { source = "autostart/waytool-tray.desktop", dest = "/etc/xdg/autostart/waytool-tray.desktop", mode = "644", config = true },
    { source = "README.md", dest = "/usr/share/doc/waytool/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/waytool/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.suggests]
gnome-shell = "*"
