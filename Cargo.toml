[package]
name = "waytool"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Command-line automation for Wayland through the freedesktop portals"
license = "Apache-2.0"
repository = "https://github.com/mx-shift/waytool"

[dependencies]
anyhow = "1.0.102"
ashpd = { version = "0.13.10", features = ["tokio", "remote_desktop", "screencast"] }
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
enumflags2 = "0.7.12"
futures-util = "0.3"
libc = "0.2.186"
reis = { version = "0.7.1", features = ["tokio"] }
tokio = { version = "1.52.3", features = ["full"] }
xkbcommon = { version = "0.9.0", default-features = false }
zbus = { version = "5.15.0", default-features = false, features = ["tokio", "p2p"] }
